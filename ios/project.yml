name: Bubbles
options:
  bundleIdPrefix: com.bubbles
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  Bubbles:
    type: application
    platform: iOS
    sources:
      - Bubbles
      - Vendor/FaceNet/FaceNet.mlpackage   # scripts/make_facenet.sh
    dependencies:
      # MediaPipe face detection (static xcframeworks; run scripts/fetch_mediapipe.sh first).
      - framework: Vendor/MediaPipe/MediaPipeTasksVision.xcframework
        embed: false
      - framework: Vendor/MediaPipe/MediaPipeTasksCommon.xcframework
        embed: false
      - sdk: libc++.tbd
      - sdk: Accelerate.framework
      - sdk: CoreMedia.framework
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: CoreVideo.framework
      - sdk: CoreImage.framework
    settings:
      base:
        "OTHER_LDFLAGS[sdk=iphoneos*]": ["$(inherited)", "-ObjC", "-force_load", "$(PROJECT_DIR)/Vendor/MediaPipe/graph_libraries/libMediaPipeTasksCommon_device_graph.a"]
        "OTHER_LDFLAGS[sdk=iphonesimulator*]": ["$(inherited)", "-ObjC", "-force_load", "$(PROJECT_DIR)/Vendor/MediaPipe/graph_libraries/libMediaPipeTasksCommon_simulator_graph.a"]
        PRODUCT_BUNDLE_IDENTIFIER: com.bubbles.app.lmg7
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: LMG7RTY598
    info:
      path: Bubbles/Info.plist
      properties:
        CFBundleDisplayName: Bubbles
        UILaunchScreen: {}
        UIAppFonts: [Bangers-Regular.ttf]
        UIBackgroundModes: [bluetooth-central, bluetooth-peripheral]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [arkit]
        NSBluetoothAlwaysUsageDescription: Bubbles finds people nearby who also run Bubbles.
        NSCameraUsageDescription: The camera recognises nearby Bubbles users by the photo they chose to share, on device, so their bubble sits on their face. Your own photo is turned into a face signature; no photo is stored or sent.
        NSMicrophoneUsageDescription: Answer the profile interview by voice.
        NSSpeechRecognitionUsageDescription: Your interview answers are transcribed on device.
        NSCalendarsFullAccessUsageDescription: Suggest plan lines from your next 7 days. Events are not stored.
